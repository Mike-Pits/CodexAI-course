<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP · Учебные агенты</title>
<style>body{font:16px system-ui;background:#eef2f8;color:#18243b;margin:0}main{max-width:1100px;margin:36px auto;padding:24px}h1{font-size:32px}section{background:white;padding:24px;border-radius:16px;margin:20px 0;box-shadow:0 6px 25px #2030500a}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #b5c2d6}button{background:#254ddb;color:white;cursor:pointer}button:disabled{opacity:.5}input{flex:1;min-width:0}form{display:flex;gap:10px}article{white-space:pre-wrap;padding:14px;border-bottom:1px solid #e1e7f0}article.user{color:#254ddb}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:12px;font-size:14px}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}#confirm{border:2px solid #d09924}button.secondary{background:#566579}@media(max-width:600px){main{padding:12px;margin:0}section{padding:14px}form{flex-wrap:wrap}}</style>
<main><p>УЧЕБНЫЙ ПРОЕКТ · MCP</p><h1 id="title">Погода через AI-агента</h1><p id="hint">Спросите о погоде в городе. Следующий вопрос может быть коротким: «А в Казани?»</p><section id="sheet" hidden><h2>Заявки из Excel</h2><button id="refresh">Обновить таблицу</button><div class="scroll" id="table"></div></section><section><h2>Диалог</h2><div id="chat" role="log" aria-live="polite"></div><div id="confirm" hidden></div><form><input id="message" aria-label="Сообщение агенту" placeholder="Введите запрос…" required maxlength="3000"><button id="send">Отправить</button></form><p id="status" role="status"></p></section><section><h2>Журнал MCP</h2><p>Название инструмента, параметры и ответ сервера. Данные появляются после реального вызова.</p><div id="trace"></div></section></main>
<script>
let session,pro=location.port==='3001';const $=id=>document.getElementById(id);function show(text,who='assistant'){const el=document.createElement('article');el.className=who;el.textContent=text;$('chat').append(el);}function table(rows){$('table').replaceChildren();if(!rows)return;const t=document.createElement('table');for(const [i,row]of rows.entries()){const tr=t.insertRow();for(const v of row){const c=document.createElement(i?'td':'th');c.textContent=v??'';tr.append(c);}}$('table').append(t);}function pending(p){$('confirm').replaceChildren();$('confirm').hidden=!p;if(!p)return;const description=document.createElement('p');description.textContent=`Изменить заявку №${p.id}, ${p.client}: «${p.old}» → «${p.status}»?`;$('confirm').append(description);for(const [label,value]of [['Подтвердить',true],['Отмена',false]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>send({confirm:value});$('confirm').append(b);}}
async function send(data){$('send').disabled=true;if(pro)$('refresh').disabled=true;$('status').textContent='Выполняется запрос…';try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,session})});const v=await r.json();session=v.session||session;if(v.answer)show(v.answer);if(v.rows)table(v.rows);pending(v.pending);for(const e of v.trace||[]){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=`${e.tool} · ${e.error?'ошибка':'результат получен'}`;p.textContent=JSON.stringify(e,null,2);d.append(s,p);$('trace').append(d);}$('status').textContent=v.error?'Запрос завершился ошибкой':'Готово';}catch(e){show('Ошибка соединения: '+e.message);$('status').textContent='Нет соединения';}finally{$('send').disabled=false;if(pro)$('refresh').disabled=false;}}
document.querySelector('form').onsubmit=e=>{e.preventDefault();const message=$('message').value.trim();if(!message)return;show(message,'user');$('message').value='';send({message});};if(pro){$('title').textContent='Заявки компьютерного сервиса';$('hint').textContent='Добавляйте заявки и меняйте статусы через MCP. Изменение статуса требует подтверждения.';$('sheet').hidden=false;$('refresh').onclick=()=>send({refresh:true});send({refresh:true});}
</script></html>
