name: Lesson 01 CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lesson_01

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Lesson_01/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Check Python build and import
        env:
          CHAT_MODE: mock
          QUOTA_DB: /tmp/lesson01-ci.sqlite3
        run: |
          python -m compileall -q app
          python -c "from app.main import app; assert app is not None"

      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js
