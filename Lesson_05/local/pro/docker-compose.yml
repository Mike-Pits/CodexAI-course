services:
  pro-rag:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge:ro

