services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      QUOTA_DB: /data/quotas.sqlite3
      TRUST_CADDY: "1"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}:8443
    volumes:
      - quota_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  quota_data:
  caddy_data:
  caddy_config:
